name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Fonts (optional)
        run: npm install --no-save --no-audit --no-fund @fontsource/anton @fontsource/poppins @fontsource/noto-nastaliq-urdu @fontsource/noto-naskh-arabic || echo "fonts skipped"

      - name: Copy ffmpeg files into app
        run: node scripts/vendor.mjs

      - name: Add Android project
        run: npx cap add android

      - name: Patch Android manifest
        run: node scripts/patch-android.mjs

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: video-maker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
